version: 2

models:
  - name: mart_creative_pretest__segment_ad
    description: "One row per age band x gender x ad. Simulated persona reactions beside real 2017 segment performance."
    columns:
      - name: segment_ad_key
        data_tests: [unique, not_null]
      - name: gender
        data_tests:
          - accepted_values:
              arguments:
                values: ['M', 'F']
      - name: ad_code
        data_tests:
          - accepted_values:
              arguments:
                values: ['A_free_trial', 'B_real_members', 'C_20_minutes', 'D_30_day_challenge']
      - name: real_ctr_pct
        description: "Real 2017 click-through rate for the segment, as a percent. Null would mean the segment join failed."
        data_tests: [not_null]